services:
  - type: web
    name: quill-mcp-blogging-platform
    runtime: docker

    plan: free

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"

      - key: DATABASE_PATH
        value: /data/quill.db

      - key: BASE_URL
        sync: false

      - key: SESSION_SECRET
        sync: false

    disk:
      name: quill-data
      mountPath: /data
      sizeGB: 1